global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "node-exporter"
    static_configs:
      # Scrape the in-compose node_exporter container so the stack is self-contained
      - targets: ["node_exporter:9100"]